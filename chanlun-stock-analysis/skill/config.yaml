# 缠论股票分析 Skill 配置文件

# 数据源配置
data_source:
  # 默认数据源：tushare 或 akshare
  default: tushare
  tushare:
    token: ""  # Tushare API Token，需要申请
  akshare:
    # Akshare无需token
    pass

# 分析参数配置
analysis:
  # 分型识别参数
  fractal:
    # 顶底分型确认需要的K线数量
    confirm_bars: 3
  
  # 笔识别参数
  pen:
    # 笔的最小长度（价格差）
    min_length: 0.0
    # 是否允许包含关系
    allow_contain: true
  
  # 线段识别参数
  segment:
    # 线段的最小笔数
    min_pens: 3
  
  # 中枢识别参数
  pivot:
    # 中枢的最小线段数
    min_segments: 3
    # 中枢级别（1=1分钟，5=5分钟，30=30分钟，60=60分钟，D=日线）
    levels: ["5", "30", "D"]

# 回测参数配置
backtest:
  # 初始资金
  initial_capital: 100000
  # 手续费率
  commission_rate: 0.0003
  # 滑点
  slippage: 0.0
  # 最大持仓比例
  max_position_ratio: 0.95

# 可视化配置
visualization:
  # 图表大小
  figure_size: [16, 9]
  # DPI
  dpi: 100
  # 是否显示网格
  show_grid: true
  # K线颜色
  kline_colors:
    up: "red"
    down: "green"
  # 中枢颜色
  pivot_color: "blue"
  # 买卖点颜色
  buy_point_color: "red"
  sell_point_color: "green"

# 日志配置
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR
  level: INFO
  # 日志文件路径
  file: "logs/chanlun_skill.log"
  # 日志文件大小限制（MB）
  rotation: 10
  # 日志保留天数
  retention: 7

# 缓存配置
cache:
  # 是否启用缓存
  enabled: true
  # 缓存类型：memory 或 redis
  type: memory
  # 缓存过期时间（秒）
  ttl: 3600
  # Redis配置（如果使用redis）
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: ""
